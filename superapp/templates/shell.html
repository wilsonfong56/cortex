<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cortex</title>
<style>
  :root {
    --bg: #0d1117; --surface: #161b22; --border: #30363d;
    --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff;
    --sidebar-w: 220px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    display: flex; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  nav {
    width: var(--sidebar-w); background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; height: 100vh;
  }
  .nav-header { padding: 16px 20px 14px; border-bottom: 1px solid var(--border); }
  .nav-header h1 { font-size: 15px; font-weight: 700; }
  .nav-header .sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .nav-body { flex: 1; overflow-y: auto; padding: 10px 8px; }
  .nav-section {
    font-size: 10px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.8px; padding: 10px 12px 4px;
  }
  .nav-item {
    display: flex; align-items: center; gap: 9px;
    padding: 8px 12px; border-radius: 6px; cursor: pointer;
    font-size: 13px; color: var(--muted); border: none; background: none;
    width: 100%; text-align: left; margin-bottom: 1px;
  }
  .nav-item:hover { background: rgba(255,255,255,0.05); color: var(--text); }
  .nav-item.active { background: rgba(88,166,255,0.12); color: var(--accent); }
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  iframe { flex: 1; border: none; width: 100%; background: var(--bg); }
</style>
</head>
<body>
<nav>
  <div class="nav-header">
    <h1>Cortex</h1>
    <div class="sub">Public slice</div>
  </div>
  <div class="nav-body">
    {% set last_section = namespace(v='') %}
    {% for item in nav_items %}
      {% if item.section != last_section.v %}
        <div class="nav-section">{{ item.section }}</div>
        {% set last_section.v = item.section %}
      {% endif %}
      <button class="nav-item" data-url="{{ item.url }}">{{ item.label }}</button>
    {% endfor %}
  </div>
</nav>
<div class="main">
  <iframe id="frame" src="{{ default_url }}"></iframe>
</div>
<script>
const frame = document.getElementById('frame');
const navItems = document.querySelectorAll('.nav-item');
navItems.forEach(btn => {
  btn.addEventListener('click', () => {
    frame.src = btn.dataset.url;
    navItems.forEach(b => b.classList.toggle('active', b === btn));
  });
});
if (navItems[0]) navItems[0].classList.add('active');
</script>
</body>
</html>
